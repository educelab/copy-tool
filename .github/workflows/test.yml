name: Test

# Tags are included because the Build workflow reacts to this workflow's
# conclusion. Without them a v* push would run no tests, fire no
# workflow_run event, and silently publish nothing.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Runtime libraries required by PySide6 even under the offscreen platform.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 libfontconfig1

      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install '.[test]'

      - name: Run tests
        run: pytest -q
