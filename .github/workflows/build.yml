name: Build

# Publishing reacts to the Test workflow's conclusion, so a red commit can
# never produce a published build. Two workflow_run facts drive the shape of
# this file: it always executes the copy on the default branch, and
# github.ref/github.sha point at the default branch rather than the commit that
# triggered the tests. The version job resolves the real ref from the event
# payload and every other job checks out that SHA.
on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
  pull_request:
  workflow_dispatch:

# Serialize per target so two pushes to main cannot race the rolling 'edge'
# tag into an inconsistent state.
concurrency:
  group: build-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Decides what to build, what to call it, and whether to publish. Runs in
  # seconds, so a tag/version disagreement fails here rather than after four
  # PyInstaller builds.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          # Tags are needed to confirm a v* head_branch is a real tag.
          fetch-depth: 0

      - id: resolve
        shell: bash
        # head_branch is attacker-controllable on fork PRs, so it arrives as an
        # env var rather than interpolated into the script body.
        env:
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          base=$(python3 -c 'from copy_tool._version import __version__; print(__version__)')
          sha=$(git rev-parse HEAD)
          # core.abbrev is length-adaptive as a repo grows; pin the width so
          # stamps stay comparable across builds.
          short=$(git rev-parse --short=8 HEAD)

          channel=none
          build=true
          if [ "$EVENT" = workflow_run ]; then
            case "$HEAD" in
              main)
                channel=edge
                ;;
              v*)
                if git rev-parse -q --verify "refs/tags/$HEAD" >/dev/null; then
                  channel=release
                else
                  build=false
                fi
                ;;
              *)
                # A test run for a PR or topic branch. The pull_request
                # trigger already builds those directly.
                build=false
                ;;
            esac
          fi

          case "$channel" in
            edge)
              # PEP 440 strips leading zeros from an all-numeric local segment,
              # which would silently corrupt a hash like 0012345. The 'g'
              # prefix (git describe's convention) keeps it non-numeric.
              version="${base}+edge.g${short}"
              ;;
            release)
              if [ "${HEAD#v}" != "$base" ]; then
                echo "::error::tag ${HEAD} disagrees with copy_tool/_version.py (${base}); bump the file or retag"
                exit 1
              fi
              version="$base"
              ;;
            *)
              version="${base}+dev.g${short}"
              ;;
          esac

          echo "Resolved $version (channel=$channel, build=$build) at $sha"
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "channel=$channel"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  # Pinned rather than macos-latest so the macOS deployment floor is explicit,
  # the same reason the Ubuntu jobs build in containers. macos-26 is arm64;
  # Intel Macs are not covered, hence the asset name.
  macos:
    name: macOS (arm64)
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stamped before pip install so the installed distribution and the
      # frozen binary report the same version.
      - name: Stamp version
        shell: bash
        run: printf '__version__ = "%s"\n' '${{ needs.version.outputs.version }}' > copy_tool/_version.py

      # The spec files bundle whatever rclone is on PATH at build time.
      - name: Install rclone
        run: brew install rclone

      - name: Build
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install .
          pyinstaller copy_tool/copy_tool_macOS.spec

      # Artifact uploads are zipped without POSIX permissions, which would
      # strip the executable bit inside the .app bundle. Tar it first.
      - name: Package
        run: tar -czf CopyTool-macos-arm64.tar.gz -C dist CopyTool.app

      - uses: actions/upload-artifact@v4
        with:
          name: copytool-macos-arm64
          path: CopyTool-macos-arm64.tar.gz
          retention-days: 7

  windows:
    name: Windows
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      # bash, not PowerShell: Windows PowerShell's '>' writes UTF-16LE, which
      # Python cannot import.
      - name: Stamp version
        shell: bash
        run: printf '__version__ = "%s"\n' '${{ needs.version.outputs.version }}' > copy_tool/_version.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rclone
        run: |
          Invoke-WebRequest -Uri 'https://downloads.rclone.org/rclone-current-windows-amd64.zip' -OutFile 'C:\rclone.zip'
          Expand-Archive C:\rclone.zip C:\
          Move-Item C:\rclone*\rclone.exe C:\Windows\

      - name: Build
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install .
          pyinstaller copy_tool/copy_tool_Windows.spec

      - name: Package
        shell: bash
        run: mv dist/CopyTool.exe CopyTool-windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: copytool-windows
          path: CopyTool-windows.exe
          retention-days: 7

  # Primary Ubuntu build, on 22.04 (jammy). PyInstaller links the build host's
  # glibc, which is forward-compatible only, so a binary built on 22.04 (glibc
  # 2.35) runs on 22.04 and newer and cannot run on anything older. Hosts older
  # than that are served by the ubuntu-legacy job below. The build runs in a
  # container rather than on a runner image so the glibc floor stays pinned.
  ubuntu:
    name: Ubuntu 22.04
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      # Prevent apt (tzdata) from blocking on an interactive timezone prompt.
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
      # git has to exist before checkout so the action clones instead of
      # falling back to a tarball download.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y software-properties-common git curl unzip
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          apt-get install -y python3.12-dev python3.12-venv binutils libgl-dev libglib2.0-dev qt6-base-dev
          curl https://rclone.org/install.sh | bash

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Stamp version
        shell: bash
        run: printf '__version__ = "%s"\n' '${{ needs.version.outputs.version }}' > copy_tool/_version.py

      - name: Build
        run: |
          python3.12 -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install .
          pyinstaller copy_tool/copy_tool_Ubuntu.spec

      # Tar preserves the executable bit that the artifact zip would drop.
      - name: Package
        run: tar -czf CopyTool-ubuntu-22.04.tar.gz -C dist CopyTool

      - uses: actions/upload-artifact@v4
        with:
          name: copytool-ubuntu-22.04
          path: CopyTool-ubuntu-22.04.tar.gz
          retention-days: 7

  # Legacy Linux build for hosts older than 22.04, down to 20.04 (focal). Unlike
  # the other three build jobs this does NOT use Python 3.12: focal has no 3.12
  # (deadsnakes dropped the series) and this artifact only has to *run* on an old
  # box, so the build tracks the target and uses focal's stock Python 3.8.
  #
  # Retire this job once every target host is on 22.04+.
  ubuntu-legacy:
    name: Ubuntu 20.04 (legacy)
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
      # libpython3.8 is the one PyInstaller actually needs -- it bundles the
      # shared libpython. The libxcb-*/libxkbcommon set is what Qt's xcb platform
      # plugin links against; PyInstaller has to import QtWidgets to trace it.
      # libgtk-3-0 is for Qt's optional gtk3 platform theme (native file dialogs);
      # it pulls gdk/pango/cairo/atk/gdk-pixbuf, so it is the only entry needed to
      # resolve that plugin. Without it the build still works, and Qt falls back
      # to its own dialogs.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3.8 python3.8-venv python3.8-dev libpython3.8 \
            binutils curl unzip ca-certificates git \
            libgl1 libegl1 libglib2.0-0 libfontconfig1 libdbus-1-3 libgtk-3-0 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-xkb1 libxcb-sync1 libxcb-xfixes0
          curl https://rclone.org/install.sh | bash

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Stamp version
        shell: bash
        run: printf '__version__ = "%s"\n' '${{ needs.version.outputs.version }}' > copy_tool/_version.py

      # Deps first, honouring requires-python so pip picks the 3.8-compatible
      # PySide6. Then the project alone with --no-deps, so --ignore-requires-python
      # relaxes only the project's own floor and never leaks into dep resolution.
      - name: Build
        run: |
          python3.8 -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-legacy.txt
          python -m pip install --no-deps --ignore-requires-python .
          pyinstaller copy_tool/copy_tool_Ubuntu.spec

      # Same spec as the ubuntu job, so the binary lands at dist/CopyTool. The
      # artifact name is what keeps the two builds apart.
      - name: Package
        run: tar -czf CopyTool-ubuntu-20.04-legacy.tar.gz -C dist CopyTool

      - uses: actions/upload-artifact@v4
        with:
          name: copytool-ubuntu-20.04-legacy
          path: CopyTool-ubuntu-20.04-legacy.tar.gz
          retention-days: 7

  # One release per run, only once every platform has built, so users never see
  # a release where some platforms updated and others did not.
  publish:
    name: Publish release
    needs: [version, macos, windows, ubuntu, ubuntu-legacy]
    if: needs.version.outputs.channel != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = edge ]; then
            # gh updates an existing release's assets but will not move its
            # tag, which would leave fresh binaries hanging off a stale commit.
            # Deleting the tag with the release is what makes 'edge' roll.
            gh release delete edge --cleanup-tag --yes || true
            gh release create edge \
              --prerelease \
              --target "$SHA" \
              --title "edge ($VERSION)" \
              --notes "Rolling build of the latest \`main\` commit (\`$SHA\`). Unstable; superseded on every push. The running app reports \`$VERSION\` in its console pane and log file." \
              dist/*
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --generate-notes \
              dist/*
          fi
